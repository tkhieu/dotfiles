packages:
  # Minimal packages installed with the distro package manager on Linux:
  # Homebrew prerequisites plus zsh (the login shell must not depend on brew).
  system:
    fedora:
      - '@development-tools'
      - 'procps-ng'
      - 'curl'
      - 'file'
      - 'git'
      - 'python3'
      - 'zsh'
    debian:
      - 'build-essential'
      - 'procps'
      - 'curl'
      - 'file'
      - 'git'
      - 'python3'
      - 'zsh'

  # Package groups shared by macOS and Linux. `chezmoi init` asks which groups
  # to install (see .chezmoi.toml.tmpl); `core` is always installed.
  groups:
    core:
      brew:
        - 'antidote'
        - 'aria2'
        - 'direnv'
        - 'fzf'
        - 'gh'
        - 'git'
        - 'git-extras'
        - 'git-filter-repo'
        - 'htop'
        - 'jq'
        - 'mise'
        - 'neovim'
        - 'pnpm'
        - 'starship'
        - 'tig'
        - 'zstd'

    dev:
      brew:
        - 'bats-core'
        - 'libyaml'
        - 'mysql-client'
        - 'oven-sh/bun/bun'
        - 'pipx'
        - 'shellcheck'
        - 'uv'
      pnpm:
        - '@ast-grep/cli'
        - 'intelephense'
        - 'typescript'
        - 'typescript-language-server'

    ai:
      brew:
        - 'multica-ai/tap/multica'
        - 'opencode'
      pnpm:
        - '@charmland/crush'
        - '@pen.dev/cli'
        - '@sourcegraph/amp'
        - 'ecc-universal'

    devops:
      brew:
        - 'act'
        - 'aws-vault'
        - 'awscli'
        - 'dnscontrol'

    media:
      brew:
        - 'ffmpeg'
        - 'imagemagick'

    cloud-cli:
      brew:
        - 'supabase/tap/supabase'
      pnpm:
        - '@googleworkspace/cli'
        - '@shopify/cli@latest'
        - 'vercel'
        - 'wrangler@latest'

  darwin:
    # macOS-only formulae, installed regardless of the selected groups.
    brews:
      - 'asc'

    casks:
      # Browsers
      - 'google-chrome'
      - 'thebrowsercompany-dia'

      # Development Tools
      - 'docker-desktop'
      - 'droid'
      - 'figma'
      - 'iterm2'
      - 'markedit'
      - 'postman'
      - 'shottr'
      - 'visual-studio-code'
      - 'wave'
      - 'xcodes-app'
      - 'anaconda'

      # Productivity
      - 'meetingbar'
      - 'notion'
      - 'notion-calendar'
      - 'raycast'
      - 'slack'
      - 'sunsama'
      - 'obsidian'
      - 'ticktick'

      # Security
      - '1password'
      - 'cloudflare-warp'
      - 'tailscale-app'

      # Utilities
      - 'applite'
      - 'mimestream'
      - 'pearcleaner'
      - 'syncthing-app'

      # Media
      - 'spotify'

      # AI Tools
      - 'antigravity'
      - 'claude'
      - 'claude-devtools'
      - 'lm-studio'
      - 'codex'

      # Database
      - 'dbeaver-community'

      # Fonts
      - 'font-hack-nerd-font'
      - 'font-noto-sans'
      - 'font-noto-sans-jp'

      # Cloud & AWS
      - 'session-manager-plugin'
