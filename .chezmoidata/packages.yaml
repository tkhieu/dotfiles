packages:
  darwin:
    # Canonical brew list. Linux reuses it via the *brews alias below
    # (darwin and linux installed identical brews — single source of truth).
    brews: &brews
      # Core & Shell
      - 'antigen'
      - 'fzf'
      - 'git'
      - 'htop'
      - 'jq'
      - 'neovim'
      - 'zsh'

      # Git Tools
      - 'gh'
      - 'git-filter-repo'
      - 'git-extras'
      - 'tig'

      # Package & Version Managers
      - 'asdf'
      - 'oven-sh/bun/bun'
      - 'npm'
      - 'nvm'
      - 'pipx'
      - 'pnpm'
      - 'pyenv'
      - 'yarn'

      # DevOps & Cloud
      - 'act'
      - 'awscli'
      - 'aws-sso-util'
      - 'direnv'
      - 'dnscontrol'
      - 'supabase/tap/supabase'

      # Development Libraries
      - 'ffmpeg'
      - 'grpc'
      - 'imagemagick'
      - 'libyaml'
      - 'mysql-client'
      - 'zstd'

      # Testing Tools
      - 'bats-core'
      - 'semgrep'
      - 'shellcheck'

      # Utilities
      - 'aria2'

      # AI Tools
      - 'asc'
      - 'beads'
      - 'block-goose-cli'
      - 'ollama'
      - 'opencode'

    casks:
      # Browsers
      - 'google-chrome'
      - 'thebrowsercompany-dia'

      # Development Tools
      - 'docker-desktop'
      - 'droid'
      - 'figma'
      - 'iterm2'
      - 'markedit'
      - 'postman'
      - 'shottr'
      - 'visual-studio-code'
      - 'wave'
      - 'xcodes-app'
      - 'anaconda'

      # Productivity
      - 'meetingbar'
      - 'notion'
      - 'notion-calendar'
      - 'raycast'
      - 'slack'
      - 'sunsama'
      - 'obsidian'
      - 'ticktick'

      # Security
      - '1password'
      - 'cloudflare-warp'
      - 'tailscale-app'

      # Utilities
      - 'applite'
      - 'mimestream'
      - 'pearcleaner'
      - 'syncthing-app'

      # Media
      - 'spotify'

      # AI Tools
      - 'antigravity'
      - 'block-goose'
      - 'claude'
      - 'claude-devtools'
      - 'lm-studio'
      - 'codex'

      # Database
      - 'dbeaver-community'

      # Fonts
      - 'font-hack-nerd-font'
      - 'font-noto-sans'
      - 'font-noto-sans-jp'

      # Cloud & AWS
      - 'session-manager-plugin'

    # Canonical pnpm global list, reused by linux via the *pnpm_globals alias.
    pnpm_globals: &pnpm_globals
      # AI Tools
      - '@sourcegraph/amp'
      - '@openai/codex'
      - 'claudekit-cli'
      - 'uipro-cli'
      - '@charmland/crush'
      - '@kaitranntt/ccs'
      - '@pencil.dev/cli'
      - 'ecc-universal'

      # DevOps & Cloud
      - '@googleworkspace/cli'
      - '@shopify/cli@latest'
      - 'vercel'
      - 'wrangler@latest'

  linux:
    # Prerequisites for Homebrew on Linux (installed via apt)
    apt_prerequisites:
      - 'build-essential'
      - 'procps'
      - 'curl'
      - 'file'
      - 'git'

    brews: *brews
    pnpm_globals: *pnpm_globals
