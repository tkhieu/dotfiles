# .github/workflows/test.yml
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: make ci-lint

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.chezmoidata/packages.yaml') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install test dependencies
        run: brew install bats-core shellcheck chezmoi

      - name: Run tests
        run: make test

      - name: Validate configs
        run: make validate-configs

      - name: Dry-run apply (renders every template and script for macOS)
        run: chezmoi init --source "$PWD" --promptDefaults --apply --dry-run --verbose

  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck zsh
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Run tests
        run: make test

  test-container:
    name: End-to-end (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, ubuntu]
    steps:
      - uses: actions/checkout@v4

      - name: Apply dotfiles in a clean container and verify
        run: make test-container DISTRO=${{ matrix.distro }} ENGINE=docker
